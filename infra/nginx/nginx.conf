# Haupt-Konfiguration, ersetzt die Alpine-Default-Datei komplett (gemountet
# auf /etc/nginx/nginx.conf). Zwei Werte sind hier bewusst hochgesetzt, siehe
# DECISIONS.md 5.6 und 9: Standard-Defaults reichen nicht für ~500
# gleichzeitige langlebige SSE/WS-Verbindungen.
user  nginx;
worker_processes auto;

# Jede Verbindung braucht 2 File-Descriptors (Client- und Upstream-Socket);
# bei 500 Clients + Puffer/Log-Handles ist das Alpine-Default oft zu knapp.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # Default ist 1024 — reicht nicht für die Ziel-Clientzahl der Messphase.
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Kein gzip: erzeugt CPU-Last, die keiner der beiden Stacks selbst trägt,
    # und würde speziell SSE (text/event-stream) verzerren (siehe 5.6).
    gzip off;

    access_log /var/log/nginx/access.log;

    include /etc/nginx/conf.d/*.conf;
}
