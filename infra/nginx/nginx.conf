# Main configuration, fully replaces the Alpine default file (mounted at
# /etc/nginx/nginx.conf). Two values are deliberately raised here, see
# DECISIONS.md 5.6.1 and README.md (file descriptor limits). The defaults
# are not enough for ~500 concurrent long-lived SSE/WS connections.
user  nginx;
worker_processes auto;

# Each connection needs 2 file descriptors (client and upstream socket).
# With 500 clients plus buffer and log handles the Alpine default is often too tight.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # The default is 1024, which is not enough for the target number of clients.
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # No gzip. It creates CPU load that neither stack carries itself and would
    # distort SSE in particular (text/event-stream), see 5.6.
    gzip off;

    access_log /var/log/nginx/access.log;

    include /etc/nginx/conf.d/*.conf;
}
