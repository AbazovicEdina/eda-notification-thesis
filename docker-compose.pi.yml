# Addition for the Raspberry Pi test server (DECISIONS.md 5.6.2, 5.14).
# Enabled via COMPOSE_FILE in the .env of the Pi (see .env.example),
# setup of the Pi in infra/pi/README.md.
#
# 1. The front Nginx and Redis are published on the LAN, because k6 and the
#    event sources run on a separate load generator. Redis has no
#    authentication, so run it only in an isolated measurement network and
#    set PI_BIND_ADDRESS to the address of the measurement network interface
#    if needed.
# 2. Each measurement cell runs in its own cgroup slice (systemd slice
#    eda_<cell>.slice). The CPU and memory budget therefore applies to the
#    whole cell, e.g. to Reverb and listener or FPM pool and queue worker
#    together, instead of per container. infra/pi/setup-slices.sh creates
#    the slices. The mapping of service -> cell matches
#    tools/orchestrate/cells.json.

services:
  nginx:
    ports:
      - "${PI_BIND_ADDRESS:-0.0.0.0}:${PI_FRONT_PORT:-8080}:80"

  redis:
    ports:
      - "${PI_BIND_ADDRESS:-0.0.0.0}:${PI_REDIS_PORT:-6379}:6379"

  node-minimal-sse:
    cgroup_parent: eda_node_minimal_sse.slice
  node-minimal-ws:
    cgroup_parent: eda_node_minimal_ws.slice

  node-express-sse:
    cgroup_parent: eda_node_express_sse.slice
  node-express-ws:
    cgroup_parent: eda_node_express_ws.slice

  node-express-sse-queue:
    cgroup_parent: eda_node_express_sse_queue.slice
  node-express-worker:
    cgroup_parent: eda_node_express_sse_queue.slice

  php-minimal-fpm:
    cgroup_parent: eda_php_minimal_sse.slice
  php-minimal-ws:
    cgroup_parent: eda_php_minimal_ws.slice

  php-laravel-fpm:
    cgroup_parent: eda_php_laravel_sse.slice
  php-laravel-reverb:
    cgroup_parent: eda_php_laravel_ws.slice
  php-laravel-listener:
    cgroup_parent: eda_php_laravel_ws.slice

  php-laravel-fpm-queue:
    cgroup_parent: eda_php_laravel_sse_queue.slice
  php-laravel-queue-worker:
    cgroup_parent: eda_php_laravel_sse_queue.slice
