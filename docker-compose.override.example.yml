# Template for local deviations.
# Copy to docker-compose.override.yml (not committed).
# Compose picks up the override file automatically, so `docker compose up`
# stays the same command with or without the override.

services:
  # Host port only for manual testing in a browser or with curl. k6 does not
  # need it (it runs in the Compose network and uses service names).
  sse-feasibility:
    ports:
      - "127.0.0.1:${HOST_SSE_FEASIBILITY_PORT:-8081}:${SSE_FEASIBILITY_PORT:-8081}"
