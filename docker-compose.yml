# Portable base, applies unchanged to every environment (locally and on the
# Raspberry Pi test server). Environment-specific settings belong in an
# additional file (locally docker-compose.override.yml, on the Pi
# docker-compose.pi.yml, see infra/pi/README.md), all parameters in the
# .env. Do not hard-code anything here.

# Higher file descriptor limit for all containers that hold many concurrent
# SSE/WS connections (README, section "Dateideskriptor-Limits"). Each
# connection needs several FDs, and the usual Linux default (often 1024) is
# not enough for 500 and more clients.
x-high-nofile: &high-nofile
  ulimits:
    nofile:
      soft: 8192
      hard: 8192

# Identical resource limits for the measured containers (DECISIONS.md
# 5.6.2, 5.10). `cpus`/`mem_limit` (not `deploy.resources.limits`) take
# effect under plain `docker compose up`, `deploy.*` only applies in swarm mode.
# Memory 1536m (Raspberry Pi 5 with 4 GB, DECISIONS.md 5.10). With client
# connects spread over 5 s, php-laravel/SSE at 500 clients also stays below
# it with a margin of about 30 %.
# On the Pi a shared cgroup slice per CELL limits additionally
# (docker-compose.pi.yml), because cells can consist of several containers.
# memswap_limit = mem_limit means no additional swap for the container.
x-sut-resources: &sut-resources
  cpus: "${SUT_CPU_LIMIT:-2}"
  mem_limit: "${SUT_MEM_LIMIT:-1536m}"
  memswap_limit: "${SUT_MEM_LIMIT:-1536m}"

# Log rotation for all services. Without a limit the container logs grow
# without bound during campaigns lasting several weeks (DECISIONS.md 5.14).
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Production mode according to the official documentation (DECISIONS.md 5.5).
# Can be switched locally via .env for debugging. tools/orchestrate logs the
# mode and aborts pilot and main campaigns if a cell does not run in
# production mode.
x-laravel-env: &laravel-env
  APP_ENV: ${LARAVEL_APP_ENV:-production}
  APP_DEBUG: ${LARAVEL_APP_DEBUG:-false}
  LOG_LEVEL: ${LARAVEL_LOG_LEVEL:-warning}
  REDIS_HOST: redis

x-node-env: &node-env
  NODE_ENV: ${SUT_NODE_ENV:-production}
  REDIS_URL: redis://redis:6379

services:
  # Event backbone (DECISIONS.md 5.4). Redis pub/sub for delivery, BullMQ and
  # Laravel Queue for the queue axis (DECISIONS.md 5.19).
  # The healthcheck runs every 2 s only while Redis starts (start_interval),
  # afterwards once per hour. Each probe starts redis-cli inside this
  # container, and its CPU time counts as CPU time of Redis (DECISIONS.md 5.18).
  redis:
    <<: *default-logging
    image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1h
      timeout: 2s
      retries: 15
      start_period: 60s
      start_interval: 2s

  # Minimal SSE server of the xk6-sse feasibility check (not a prototype).
  sse-feasibility:
    <<: *default-logging
    build: ./tools/sse-feasibility
    environment:
      PORT: ${SSE_FEASIBILITY_PORT:-8081}
      EVENT_INTERVAL_MS: ${SSE_EVENT_INTERVAL_MS:-1000}

  # --- Event sources (load side) ---------------------------------------------
  # Replace the RFID/MQTT hardware of Lokato. Per load level, tools/orchestrate
  # starts the sources needed by the cells of the campaign.
  # SIMULATOR_REDIS_HOST is the address of the Pi on the separate load
  # generator (infra/pi/README.md), locally the Compose service `redis`.

  # Pub/sub directly on scan-events (all cells without a queue).
  event-simulator:
    <<: *default-logging
    build: ./tools/event-simulator
    image: eda-thesis-event-simulator:latest
    environment:
      MODE: pubsub
      REDIS_HOST: ${SIMULATOR_REDIS_HOST:-redis}
      REDIS_PORT: ${SIMULATOR_REDIS_PORT:-6379}
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
      COUNT: ${SIMULATOR_COUNT:-0}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # BullMQ jobs into the queue scan-events (cell node-express-sse-queue).
  event-simulator-bullmq:
    <<: *default-logging
    image: eda-thesis-event-simulator:latest
    environment:
      MODE: queue
      REDIS_HOST: ${SIMULATOR_REDIS_HOST:-redis}
      REDIS_PORT: ${SIMULATOR_REDIS_PORT:-6379}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
      COUNT: ${SIMULATOR_COUNT:-0}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # Laravel jobs into the queue scan-events (cell php-laravel-sse-queue).
  # Laravel jobs have their own format that only Laravel can create
  # (app/Console/Commands/ProduceScanEventsCommand.php).
  laravel-producer:
    <<: *default-logging
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "scan:produce"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
      REDIS_HOST: ${SIMULATOR_REDIS_HOST:-redis}
      REDIS_PORT: ${SIMULATOR_REDIS_PORT:-6379}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # Figures for the written thesis (tools/figures/README.md), run once
  # via `docker compose --profile tools run --rm figures ...`.
  figures:
    <<: *default-logging
    build: ./tools/figures
    image: eda-thesis-figures:latest
    volumes:
      - ./results:/results
    profiles: ["tools"]

  # k6 with xk6-sse. Does not start with `up`, but via:
  #   docker compose --profile load run --rm k6 run scripts/<script>.js
  k6:
    <<: *default-logging
    build: ./k6
    profiles: ["load"]
    environment:
      K6_TARGET_BASE_URL: ${K6_TARGET_BASE_URL:-http://sse-feasibility:8081}
      K6_VUS: ${K6_VUS:-50}
      K6_HOLD_SECONDS: ${K6_HOLD_SECONDS:-60}
    working_dir: /k6
    volumes:
      - ./k6:/k6:ro
      - ./results:/results

  # Resource measurement per run (DECISIONS.md 5.16). Reads CPU time and
  # memory directly from the cgroup files (exact, hardly any load of its own).
  # `cgroup: host` makes the host's cgroup hierarchy visible read-only. Runs on
  # the SUT side (cells, Redis) and on the load side (load of the load
  # generator), see tools/resource-sampler.
  resource-sampler:
    <<: *default-logging
    build: ./tools/resource-sampler
    image: eda-thesis-resource-sampler:latest
    cgroup: host
    init: true
    profiles: ["tools"]

  # Front Nginx in front of the cell currently measured (DECISIONS.md 5.6.1).
  # SUT_MODE selects the template, "http" (reverse proxy for Node.js, Ratchet,
  # Reverb) or "fastcgi" (directly to PHP-FPM). tools/orchestrate sets
  # SUT_HOST/SUT_PORT and the SUT_FASTCGI_* values per cell (cells.json).
  nginx:
    <<: [*high-nofile, *default-logging]
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    environment:
      SUT_HOST: ${SUT_HOST:-node-minimal-sse}
      SUT_PORT: ${SUT_PORT:-8080}
      SUT_FASTCGI_SCRIPT: ${SUT_FASTCGI_SCRIPT:-/var/www/sse.php}
      SUT_FASTCGI_SCRIPT_NAME: ${SUT_FASTCGI_SCRIPT_NAME:-/sse.php}
      SUT_FASTCGI_ROOT: ${SUT_FASTCGI_ROOT:-/var/www}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-3600}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates/${SUT_MODE:-http}:/etc/nginx/templates:ro

  # --- Node minimal variant: http module / ws library, no framework --------
  # One Redis subscriber per process (DECISIONS.md 5.4). Only the cells of the
  # running campaign are running (DECISIONS.md 5.6.3).
  node-minimal-sse:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/node-minimal
    image: eda-thesis-node-minimal:latest
    command: ["node", "sse.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-minimal"]

  node-minimal-ws:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-node-minimal:latest
    command: ["node", "ws.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-minimal"]

  # --- PHP minimal variant: plain PHP, no framework ------------------------
  # SSE: PHP-FPM, one worker per connection (DECISIONS.md 5.5). The front
  # Nginx speaks FastCGI directly to this pool ("fastcgi" mode).
  # WS: own long-running process with Ratchet/ReactPHP, speaks HTTP/WS itself.
  php-minimal-fpm:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/php-minimal
    image: eda-thesis-php-minimal:latest
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-minimal"]

  php-minimal-ws:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-php-minimal:latest
    command: ["php", "ws.php"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
      PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-minimal"]

  # --- Laravel: SSE via PHP-FPM, WS via Reverb -----------------------------
  # One image (prototypes/php-laravel/Dockerfile) for all processes. Each one
  # starts via laravel-start (caches in production mode, docker/start.sh).
  # env_file instead of a .env baked into the image, so that secrets
  # (APP_KEY, REVERB_*) never end up in the image. environment overrides the mode.
  php-laravel-fpm:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/php-laravel
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php-fpm"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  php-laravel-reverb:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  # Redis -> Reverb (scan:listen). Belongs to the cell php-laravel/WS.
  php-laravel-listener:
    <<: *default-logging
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "scan:listen"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  # --- Queue axis, PHP (DECISIONS.md 5.19) ---------------------------------
  # Cell php-laravel-sse-queue. A Laravel worker processes the jobs from
  # scan-events and publishes on notifications-laravel. A separate FPM pool
  # with the same SSE route subscribes to that channel instead of scan-events.
  # The channel belongs to this cell only. The BullMQ cell has its own, so that
  # neither SSE endpoint receives the events of the other pipeline when both
  # cells run in the same campaign (comparison 11).
  php-laravel-fpm-queue:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php-fpm"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
      EVENT_CHANNEL: notifications-laravel
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel-queue"]

  # block_for: the worker waits blocking for jobs instead of sleeping 3 s
  # while the queue is empty (documented Laravel setting, DECISIONS.md 5.20).
  php-laravel-queue-worker:
    <<: *default-logging
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "queue:work", "redis", "--queue=scan-events"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
      REDIS_QUEUE_BLOCK_FOR: 5
      NOTIFICATION_CHANNEL: notifications-laravel
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel-queue"]

  # --- Express variant -------------------------------------------------------
  # sse.js/ws.js are identical in content to node-minimal (Express instead of
  # the http module), see the comments there.
  node-express-sse:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/node-express
    image: eda-thesis-node-express:latest
    command: ["node", "sse.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express"]

  node-express-ws:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-node-express:latest
    command: ["node", "ws.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express"]

  # --- Queue axis, Node.js (DECISIONS.md 5.19) -----------------------------
  # Cell node-express-sse-queue. A BullMQ worker processes the jobs from
  # scan-events and publishes on notifications-bullmq. A separate SSE process
  # subscribes to that channel instead of scan-events. The channel belongs to
  # this cell only (see the PHP queue axis above).
  node-express-sse-queue:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-node-express:latest
    command: ["node", "sse.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: notifications-bullmq
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]

  node-express-worker:
    <<: *default-logging
    image: eda-thesis-node-express:latest
    command: ["node", "queue/worker.js"]
    environment:
      NODE_ENV: ${SUT_NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NOTIFICATION_CHANNEL: notifications-bullmq
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]

  # Single test job for trying out the worker by hand.
  node-express-producer:
    <<: *default-logging
    image: eda-thesis-node-express:latest
    command: ["node", "queue/producer.js"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]
