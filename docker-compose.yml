# Portable Basis — gilt unverändert auf jeder Umgebung (lokal wie auf dem
# Raspberry-Pi-Testserver). Umgebungsspezifisches gehört in eine
# Ergänzungsdatei (lokal: docker-compose.override.yml; Pi:
# docker-compose.pi.yml, siehe infra/pi/README.md), alle Parameter in die
# .env. Hier nichts hartcodieren.

# Höheres File-Descriptor-Limit für alle Container, die viele gleichzeitige
# SSE/WS-Verbindungen halten (README, Abschnitt "Dateideskriptor-Limits"):
# Jede Verbindung braucht mehrere FDs, der übliche Linux-Default (oft 1024)
# reicht für 500 und mehr Clients nicht.
x-high-nofile: &high-nofile
  ulimits:
    nofile:
      soft: 8192
      hard: 8192

# Identische Ressourcen-Limits für die gemessenen Container (DECISIONS.md
# 5.6.2, 5.10). `cpus`/`mem_limit` (nicht `deploy.resources.limits`) wirken
# unter reinem `docker compose up`; `deploy.*` greift nur im Swarm-Modus.
# Speicher 1536m (Raspberry Pi 5 mit 4 GB, DECISIONS.md 5.10). Für
# php-laravel/SSE bei 500 Clients reicht das auf dem Pi nicht, die
# Entscheidung über Hardware und Budget ist offen.
# Auf dem Pi begrenzt zusätzlich ein gemeinsamer cgroup-Topf pro ZELLE
# (docker-compose.pi.yml), da Zellen aus mehreren Containern bestehen können.
# memswap_limit = mem_limit: kein zusätzlicher Swap für den Container.
x-sut-resources: &sut-resources
  cpus: "${SUT_CPU_LIMIT:-2}"
  mem_limit: "${SUT_MEM_LIMIT:-1536m}"
  memswap_limit: "${SUT_MEM_LIMIT:-1536m}"

# Log-Rotation für alle Dienste: Ohne Begrenzung wachsen die Container-Logs
# bei wochenlangen Kampagnen unbegrenzt (DECISIONS.md 5.14).
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Produktionsbetrieb nach offizieller Dokumentation (DECISIONS.md 5.5).
# Für die Fehlersuche lokal per .env umschaltbar; tools/orchestrate
# protokolliert den Modus und bricht Pilot- und Hauptkampagnen ab, wenn eine
# Zelle nicht im Produktionsbetrieb läuft.
x-laravel-env: &laravel-env
  APP_ENV: ${LARAVEL_APP_ENV:-production}
  APP_DEBUG: ${LARAVEL_APP_DEBUG:-false}
  LOG_LEVEL: ${LARAVEL_LOG_LEVEL:-warning}
  REDIS_HOST: redis

x-node-env: &node-env
  NODE_ENV: ${SUT_NODE_ENV:-production}
  REDIS_URL: redis://redis:6379

services:
  # Event-Backbone (DECISIONS.md 5.4): Redis Pub/Sub für die Zustellung,
  # BullMQ und Laravel Queue für die Queue-Achse (DECISIONS.md 5.19).
  redis:
    <<: *default-logging
    image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Minimaler SSE-Server der xk6-sse-Machbarkeitsprüfung (kein Prototyp).
  sse-feasibility:
    <<: *default-logging
    build: ./tools/sse-feasibility
    environment:
      PORT: ${SSE_FEASIBILITY_PORT:-8081}
      EVENT_INTERVAL_MS: ${SSE_EVENT_INTERVAL_MS:-1000}

  # --- Ereignisquellen (Lastseite) ------------------------------------------
  # Ersetzen die RFID/MQTT-Hardware aus Lokato. tools/orchestrate startet pro
  # Laststufe die Quellen, die die Zellen der Kampagne brauchen.
  # SIMULATOR_REDIS_HOST: auf dem separaten Lastgenerator die Adresse des Pi
  # (infra/pi/README.md), lokal der Compose-Service `redis`.

  # Pub/Sub direkt auf scan-events (alle Zellen ohne Queue).
  event-simulator:
    <<: *default-logging
    build: ./tools/event-simulator
    image: eda-thesis-event-simulator:latest
    environment:
      MODE: pubsub
      REDIS_HOST: ${SIMULATOR_REDIS_HOST:-redis}
      REDIS_PORT: ${SIMULATOR_REDIS_PORT:-6379}
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
      COUNT: ${SIMULATOR_COUNT:-0}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # BullMQ-Jobs in die Queue scan-events (Zelle node-express-sse-queue).
  event-simulator-bullmq:
    <<: *default-logging
    image: eda-thesis-event-simulator:latest
    environment:
      MODE: queue
      REDIS_HOST: ${SIMULATOR_REDIS_HOST:-redis}
      REDIS_PORT: ${SIMULATOR_REDIS_PORT:-6379}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
      COUNT: ${SIMULATOR_COUNT:-0}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # Laravel-Jobs in die Queue scan-events (Zelle php-laravel-sse-queue).
  # Laravel-Jobs haben ein eigenes Format, das nur Laravel erzeugen kann
  # (app/Console/Commands/ProduceScanEventsCommand.php).
  laravel-producer:
    <<: *default-logging
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "scan:produce"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
      REDIS_HOST: ${SIMULATOR_REDIS_HOST:-redis}
      REDIS_PORT: ${SIMULATOR_REDIS_PORT:-6379}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # Abbildungen für die schriftliche Arbeit (tools/figures/README.md), einmalig
  # per `docker compose --profile tools run --rm figures ...`.
  figures:
    <<: *default-logging
    build: ./tools/figures
    image: eda-thesis-figures:latest
    volumes:
      - ./results:/results
    profiles: ["tools"]

  # k6 mit xk6-sse — startet nicht bei `up`, sondern per:
  #   docker compose --profile load run --rm k6 run scripts/<skript>.js
  k6:
    <<: *default-logging
    build: ./k6
    profiles: ["load"]
    environment:
      K6_TARGET_BASE_URL: ${K6_TARGET_BASE_URL:-http://sse-feasibility:8081}
      K6_VUS: ${K6_VUS:-50}
      K6_HOLD_SECONDS: ${K6_HOLD_SECONDS:-60}
    working_dir: /k6
    volumes:
      - ./k6:/k6:ro
      - ./results:/results

  # Ressourcen-Messung pro Lauf (DECISIONS.md 5.16): liest CPU-Zeit und
  # Speicher direkt aus den cgroup-Dateien (exakt, kaum Eigenlast). `cgroup:
  # host` macht die cgroup-Hierarchie des Hosts lesend sichtbar. Läuft auf
  # der SUT-Seite (Zellen, Redis) und auf der Lastseite (Auslastung des
  # Lastgenerators); siehe tools/resource-sampler.
  resource-sampler:
    <<: *default-logging
    build: ./tools/resource-sampler
    image: eda-thesis-resource-sampler:latest
    cgroup: host
    init: true
    profiles: ["tools"]

  # Front-Nginx vor der jeweils gemessenen Zelle (DECISIONS.md 5.6.1).
  # SUT_MODE wählt das Template: "http" (Reverse-Proxy für Node.js, Ratchet,
  # Reverb) oder "fastcgi" (direkt zu PHP-FPM). SUT_HOST/SUT_PORT und die
  # SUT_FASTCGI_*-Werte setzt tools/orchestrate pro Zelle (cells.json).
  nginx:
    <<: [*high-nofile, *default-logging]
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    environment:
      SUT_HOST: ${SUT_HOST:-node-minimal-sse}
      SUT_PORT: ${SUT_PORT:-8080}
      SUT_FASTCGI_SCRIPT: ${SUT_FASTCGI_SCRIPT:-/var/www/sse.php}
      SUT_FASTCGI_SCRIPT_NAME: ${SUT_FASTCGI_SCRIPT_NAME:-/sse.php}
      SUT_FASTCGI_ROOT: ${SUT_FASTCGI_ROOT:-/var/www}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-3600}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates/${SUT_MODE:-http}:/etc/nginx/templates:ro

  # --- Node-Minimalvariante: http-Modul / ws-Library, kein Framework -----
  # Ein Redis-Subscriber pro Prozess (DECISIONS.md 5.4); nur die Zellen der
  # laufenden Kampagne laufen (DECISIONS.md 5.6.3).
  node-minimal-sse:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/node-minimal
    image: eda-thesis-node-minimal:latest
    command: ["node", "sse.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-minimal"]

  node-minimal-ws:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-node-minimal:latest
    command: ["node", "ws.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-minimal"]

  # --- PHP-Minimalvariante: reines PHP, kein Framework -------------------
  # SSE: PHP-FPM, ein Worker pro Verbindung (DECISIONS.md 5.5); der
  # Front-Nginx spricht FastCGI direkt mit diesem Pool (Modus "fastcgi").
  # WS: eigener Dauerprozess mit Ratchet/ReactPHP, spricht HTTP/WS selbst.
  php-minimal-fpm:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/php-minimal
    image: eda-thesis-php-minimal:latest
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-minimal"]

  php-minimal-ws:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-php-minimal:latest
    command: ["php", "ws.php"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
      PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-minimal"]

  # --- Laravel: SSE über PHP-FPM, WS über Reverb ---------------------------
  # Ein Image (prototypes/php-laravel/Dockerfile) für alle Prozesse. Jeder
  # startet über laravel-start (Caches im Produktionsbetrieb, docker/start.sh).
  # env_file statt gebackenem .env im Image, damit Secrets (APP_KEY,
  # REVERB_*) nie im Image landen; environment überschreibt den Modus.
  php-laravel-fpm:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/php-laravel
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php-fpm"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  php-laravel-reverb:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  # Redis -> Reverb (scan:listen). Gehört zur Zelle php-laravel/WS.
  php-laravel-listener:
    <<: *default-logging
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "scan:listen"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  # --- Queue-Achse, PHP (DECISIONS.md 5.19) --------------------------------
  # Zelle php-laravel-sse-queue: Laravel-Worker verarbeitet die Jobs aus
  # scan-events und veröffentlicht auf notifications; ein eigener FPM-Pool
  # mit derselben SSE-Route abonniert notifications statt scan-events.
  php-laravel-fpm-queue:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php-fpm"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
      EVENT_CHANNEL: notifications
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel-queue"]

  # block_for: Worker wartet blockierend auf Jobs statt bei leerer Queue
  # 3 s zu schlafen (dokumentierte Laravel-Einstellung, DECISIONS.md 5.20).
  php-laravel-queue-worker:
    <<: *default-logging
    image: eda-thesis-php-laravel:latest
    command: ["laravel-start", "php", "artisan", "queue:work", "redis", "--queue=scan-events"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      <<: *laravel-env
      REDIS_QUEUE_BLOCK_FOR: 5
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel-queue"]

  # --- Express-Variante ------------------------------------------------------
  # sse.js/ws.js sind inhaltlich identisch zu node-minimal (Express statt
  # http-Modul), siehe dortige Kommentare.
  node-express-sse:
    <<: [*high-nofile, *sut-resources, *default-logging]
    build: ./prototypes/node-express
    image: eda-thesis-node-express:latest
    command: ["node", "sse.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express"]

  node-express-ws:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-node-express:latest
    command: ["node", "ws.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express"]

  # --- Queue-Achse, Node.js (DECISIONS.md 5.19) ----------------------------
  # Zelle node-express-sse-queue: BullMQ-Worker verarbeitet die Jobs aus
  # scan-events und veröffentlicht auf notifications; ein eigener
  # SSE-Prozess abonniert notifications statt scan-events.
  node-express-sse-queue:
    <<: [*high-nofile, *sut-resources, *default-logging]
    image: eda-thesis-node-express:latest
    command: ["node", "sse.js"]
    environment:
      <<: *node-env
      EVENT_CHANNEL: notifications
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]

  node-express-worker:
    <<: *default-logging
    image: eda-thesis-node-express:latest
    command: ["node", "queue/worker.js"]
    environment:
      NODE_ENV: ${SUT_NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]

  # Einzelner Test-Job zum manuellen Ausprobieren des Workers.
  node-express-producer:
    <<: *default-logging
    image: eda-thesis-node-express:latest
    command: ["node", "queue/producer.js"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]
