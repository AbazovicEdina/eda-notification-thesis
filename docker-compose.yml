# Portable Basis — gilt unverändert auf jeder Umgebung (lokal wie FH-Server).
# Umgebungsspezifisches (Host-Ports etc.) gehört in docker-compose.override.yml,
# alle Parameter in die .env. Hier nichts hartcodieren.

# Höheres File-Descriptor-Limit für alle Container, die viele gleichzeitige
# SSE/WS-Verbindungen halten (README, Abschnitt "OS-Level-Limits"): jede
# Verbindung braucht mehrere FDs, der übliche Linux-Default (oft 1024)
# reicht für 500 Ziel-Clients nicht. Per YAML-Anchor auf die betroffenen
# Services angewendet, statt es 8x zu wiederholen.
x-high-nofile: &high-nofile
  ulimits:
    nofile:
      soft: 8192
      hard: 8192

# Identische Ressourcen-Limits für die tatsächlich GEMESSENEN SUT-Prozesse
# (DECISIONS.md 5.6.2/5.10) — ohne das misst der Vergleich auch, wie viele
# Host-Ressourcen sich ein Stack per Default nimmt, statt wie effizient er
# sie nutzt. `cpus`/`mem_limit` (nicht `deploy.resources.limits`!) wirken
# unter reinem `docker compose up` — `deploy.*` greift nur im Swarm-Modus.
# Platzhalterwerte, bis die FH-Server-Hardware bekannt ist (DECISIONS.md 6).
x-sut-resources: &sut-resources
  cpus: "${SUT_CPU_LIMIT:-2}"
  mem_limit: "${SUT_MEM_LIMIT:-512m}"

services:
  # Event-Backbone für die Prototypen (siehe DECISIONS.md 5.4): BullMQ
  # (Node) und Laravel Queues (PHP) nutzen dasselbe Redis für Jobs, die
  # SSE/WS-Prototypen abonnieren die Pub/Sub-Kanäle direkt.
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Minimaler SSE-Server für die xk6-sse-Machbarkeitsprüfung (kein Prototyp!)
  sse-feasibility:
    build: ./tools/sse-feasibility
    environment:
      PORT: ${SSE_FEASIBILITY_PORT:-8081}
      EVENT_INTERVAL_MS: ${SSE_EVENT_INTERVAL_MS:-1000}

  # Simulierter Scan-Event-Generator (ersetzt MQTT/RFID-Hardware aus Lokato).
  # Startet nicht bei `up`, sondern per: docker compose --profile tools run --rm event-simulator
  event-simulator:
    build: ./tools/event-simulator
    environment:
      MODE: ${SIMULATOR_MODE:-pubsub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
      RATE_PER_SECOND: ${SIMULATOR_RATE:-1}
      COUNT: ${SIMULATOR_COUNT:-0}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  # Isolierter Redis-Pub/Sub-Baseline-Test (Prompt Teil 2, Aufgabe 10) —
  # tools/redis-baseline/README.md.
  redis-baseline:
    build: ./tools/redis-baseline
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
      CLIENTS: ${BASELINE_CLIENTS:-50}
      HOLD_SECONDS: ${BASELINE_HOLD_SECONDS:-60}
      EVENT_INTERVAL_MS: ${SSE_EVENT_INTERVAL_MS:-1000}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./results:/results
    profiles: ["tools"]

  # k6 mit xk6-sse — startet nicht bei `up`, sondern per:
  #   docker compose run --rm k6 run scripts/<skript>.js
  k6:
    build: ./k6
    profiles: ["load"]
    environment:
      K6_TARGET_BASE_URL: ${K6_TARGET_BASE_URL:-http://sse-feasibility:8081}
      K6_VUS: ${K6_VUS:-50}
      K6_HOLD_SECONDS: ${K6_HOLD_SECONDS:-60}
    working_dir: /k6
    volumes:
      - ./k6:/k6:ro
      - ./results:/results

  # Einheitlicher Reverse-Proxy vor der jeweils aktiven SUT (DECISIONS.md 5.6).
  # SUT_HOST/SUT_PORT wählen die Konfiguration; siehe infra/nginx/templates/.
  nginx:
    <<: *high-nofile
    image: nginx:1.27-alpine
    environment:
      SUT_HOST: ${SUT_HOST:-node-minimal-sse}
      SUT_PORT: ${SUT_PORT:-8080}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-3600}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro

  # --- Node-Minimalvariante: reines http-Modul / ws-Library, kein Framework
  # Zwei Services (ein Redis-Subscriber pro Prozess, DECISIONS.md 5.4);
  # nur der jeweils gemessene läuft (DECISIONS.md 5.6.3).
  node-minimal-sse:
    <<: [*high-nofile, *sut-resources]
    build: ./prototypes/node-minimal
    image: eda-thesis-node-minimal:latest
    command: ["node", "sse.js"]
    environment:
      REDIS_URL: redis://redis:6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-minimal"]

  node-minimal-ws:
    <<: [*high-nofile, *sut-resources]
    image: eda-thesis-node-minimal:latest
    command: ["node", "ws.js"]
    environment:
      REDIS_URL: redis://redis:6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-minimal"]

  # --- PHP-Minimalvariante: reines PHP, kein Framework -------------------
  # Zwei Container, weil PHP-FPM nur FastCGI spricht (kein HTTP): die
  # lokale Nginx-Brücke übersetzt HTTP -> FastCGI. Das ist Teil des
  # FPM-Laufzeitmodells selbst (DECISIONS.md 5.5), keine zusätzliche, durch
  # den Testaufbau eingeführte Verzögerung — siehe nginx-bridge.conf.
  # WS gibt es hier nicht: Reverb (php-laravel) übernimmt WS auch für die
  # Minimalvariante, da Reverb zwingend Laravel voraussetzt (DECISIONS.md 5.5).
  php-minimal-fpm:
    <<: [*high-nofile, *sut-resources]
    build: ./prototypes/php-minimal
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-minimal"]

  php-minimal-nginx:
    <<: *high-nofile
    image: nginx:1.27-alpine
    volumes:
      - ./prototypes/php-minimal/nginx-bridge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-minimal-fpm
    profiles: ["php-minimal"]

  # --- Laravel + Reverb: SSE via FPM (wie oben), WS via Reverb -----------
  # Ein Image (siehe prototypes/php-laravel/Dockerfile), vier Prozesse:
  # fpm (SSE-Route), nginx (Brücke, wie bei php-minimal), reverb (WS-Server,
  # hört direkt auf HTTP/WS — braucht kein FPM), listener (Redis -> Reverb-
  # Broadcast-Brücke, DECISIONS.md 5.4/5.5). env_file statt gebackenem .env
  # im Image, damit Secrets (APP_KEY, REVERB_*) nie im Image landen.
  php-laravel-fpm:
    <<: [*high-nofile, *sut-resources]
    build: ./prototypes/php-laravel
    image: eda-thesis-php-laravel:latest
    env_file: ./prototypes/php-laravel/.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  php-laravel-nginx:
    <<: *high-nofile
    image: nginx:1.27-alpine
    volumes:
      - ./prototypes/php-laravel/nginx-bridge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-laravel-fpm
    profiles: ["php-laravel"]

  php-laravel-reverb:
    <<: [*high-nofile, *sut-resources]
    image: eda-thesis-php-laravel:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  php-laravel-listener:
    image: eda-thesis-php-laravel:latest
    command: ["php", "artisan", "scan:listen"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel"]

  # Laravel-Queue-Grundgerüst (Prompt Teil 2, Aufgabe 7) — siehe
  # app/Jobs/ProcessScanEvent.php; getrennt von SSE/WS, siehe dortige
  # Kommentare. Nicht Teil der gemessenen SUT-Profile.
  php-laravel-queue-worker:
    image: eda-thesis-php-laravel:latest
    command: ["php", "artisan", "queue:work", "redis", "--queue=scan-events"]
    env_file: ./prototypes/php-laravel/.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["php-laravel-queue"]

  # --- Express + BullMQ: voller Lokato-Pipeline-Prototyp -----------------
  # sse.js/ws.js sind inhaltlich identisch zu node-minimal (nur Express statt
  # http-Modul) — siehe dortige Kommentare zur Trennung von der Queue.
  node-express-sse:
    <<: [*high-nofile, *sut-resources]
    build: ./prototypes/node-express
    image: eda-thesis-node-express:latest
    command: ["node", "sse.js"]
    environment:
      REDIS_URL: redis://redis:6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express"]

  node-express-ws:
    <<: [*high-nofile, *sut-resources]
    image: eda-thesis-node-express:latest
    command: ["node", "ws.js"]
    environment:
      REDIS_URL: redis://redis:6379
      EVENT_CHANNEL: ${EVENT_CHANNEL:-scan-events}
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express"]

  # BullMQ-Grundgerüst (Prompt Teil 2, Aufgabe 7) — siehe queue/README.md;
  # nicht Teil der gemessenen SUT-Profile.
  node-express-worker:
    image: eda-thesis-node-express:latest
    command: ["node", "queue/worker.js"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]

  node-express-producer:
    image: eda-thesis-node-express:latest
    command: ["node", "queue/producer.js"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["node-express-queue"]
