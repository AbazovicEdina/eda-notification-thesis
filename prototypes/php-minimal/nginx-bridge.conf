# Lokale Nginx-Brücke für PHP-FPM: FPM spricht nur FastCGI, kein HTTP direkt.
# Das ist Teil des FPM-Laufzeitmodells selbst (DECISIONS.md 5.5), keine
# zusätzliche, durch den Testaufbau eingeführte Verzögerung — der einheitliche
# Front-Proxy (infra/nginx) sieht davon nichts und behandelt diesen Bridge+FPM-
# Verbund wie jeden anderen HTTP-Upstream (genau wie die Node-Prototypen).

# $fpm_upstream statt eines statischen fastcgi_pass-Ziels: Nginx löst einen
# Hostnamen in einem statischen fastcgi_pass NUR beim Start auf und cached
# das Ergebnis dauerhaft — wird php-minimal-fpm neu erstellt (neue IP), bricht
# die Brücke mit "Host is unreachable", bis dieser Container auch neu startet.
# Über eine Variable + Resolver wird pro Request neu aufgelöst.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /sse {
        set $fpm_upstream php-minimal-fpm:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/sse.php;
        include fastcgi_params;
        # Analog zu proxy_buffering im Front-Proxy: sonst misst man
        # FastCGI-Pufferung statt tatsächliche Zustellung.
        fastcgi_buffering off;
        fastcgi_read_timeout 3600;
    }
}
