; Overrides the default pool limits of the www.conf in the base image.
; Reasoning and memory estimate in README, section "PHP-FPM-Dimensionierung".
; pm.max_children >= target number of clients (500), because DECISIONS.md 5.5
; provides one worker per connection. With pm = static a worker only takes up
; its own memory after its first request, so every campaign starts with a
; priming pass of 550 clients (DECISIONS.md 5.9).
[www]
pm = static
pm.max_children = 550
; Built-in health endpoint of PHP-FPM. The front Nginx speaks FastCGI directly
; to this pool (DECISIONS.md 5.6.1) and uses it before every run to check
; whether the pool responds.
ping.path = /healthz
ping.response = ok
