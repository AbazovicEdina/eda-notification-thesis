# Lokale Nginx-Brücke für PHP-FPM (siehe prototypes/php-minimal/nginx-bridge.conf
# für die ausführliche Begründung: Teil des FPM-Laufzeitmodells, keine durch
# den Testaufbau eingeführte zusätzliche Verzögerung). Laravel routet über
# ein einziges Front-Skript (public/index.php), deshalb hier das übliche
# try_files-Muster statt eines einzelnen fastcgi_pass wie bei php-minimal.

# $fpm_upstream statt eines statischen fastcgi_pass-Ziels: siehe
# prototypes/php-minimal/nginx-bridge.conf für die Begründung (statische
# Ziele cachen die aufgelöste IP dauerhaft und brechen, wenn der FPM-
# Container neu erstellt wird).
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    root /var/www/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $fpm_upstream php-laravel-fpm:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Analog zu proxy_buffering im Front-Proxy: sonst misst man
        # FastCGI-Pufferung statt tatsächliche Zustellung.
        fastcgi_buffering off;
        fastcgi_read_timeout 3600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
