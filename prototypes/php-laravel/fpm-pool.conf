; Überschreibt die Default-Pool-Grenzen der www.conf des Basis-Images.
; Begründung und Speicherrechnung: siehe README, Abschnitt
; "PHP-FPM-Dimensionierung". pm.max_children >= Ziel-Clientzahl (500), da
; DECISIONS.md 5.5 pro Verbindung einen Worker vorsieht.
[www]
pm = static
pm.max_children = 550
