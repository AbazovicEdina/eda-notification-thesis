; Überschreibt die Default-Pool-Grenzen der www.conf des Basis-Images.
; Begründung und Speicherrechnung: README, Abschnitt "PHP-FPM-Dimensionierung".
; pm.max_children >= Ziel-Clientzahl (500), da DECISIONS.md 5.5 pro
; Verbindung einen Worker vorsieht.
[www]
pm = static
pm.max_children = 550
; Eingebauter Erreichbarkeits-Endpunkt von PHP-FPM: Der Front-Nginx spricht
; FastCGI direkt mit diesem Pool (DECISIONS.md 5.6.1) und prüft darüber vor
; jedem Lauf, ob der Pool antwortet.
ping.path = /healthz
ping.response = ok
